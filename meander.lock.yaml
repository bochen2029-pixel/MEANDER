# meander.lock — the pinned numbers. THE single source of every threshold.
#
# DISCIPLINE (spec v0.2 §7, §11 / M-PIN):
#   * Every floor below was pinned BEFORE any phi was trained and BEFORE any
#     result was looked at. Pre-registration is the whole point. A floor may be
#     revised ONLY by bumping `schema` and recording the old value + the reason
#     in `revisions:` below. Silently moving a bar after a peek is the one
#     unrecoverable sin in this project.
#   * Every number carries a `provenance` tag. Nothing here is allowed to be a
#     bare number of unknown origin:
#         measured            - produced by this harness, reproducible, fp'd
#         prior               - a v0.2 paper estimate, NOT yet measured
#         nominal_unmeasured  - a stand-in chosen by fiat; SAFETY-class
#         pinned_by_fiat      - a threshold set by judgement, pre-registration
#   * Any law whose input is still `nominal_unmeasured` is DISABLED and must be
#     reported as disabled, never silently defaulted (see `disabled_laws`).

schema: v0.2-b0
generated: 2026-08-27
stake: MEANDER-SPEC-v0.2.md

# ---------------------------------------------------------------- version
# M-PIN: version = the tuple of fingerprints. Nulls stay null until the
# artifact exists; the harness refuses to claim a rung whose fp is null.
version:
  E_model:      null            # PENDING - see `lexicon:` below
  E_fp:         null
  phi_fp:       null            # B1 artifact; does not exist yet
  R_fp:         null            # B2 artifact
  valency_fp:   null            # B3 artifact
  noise_fp:     "nominal-v1"    # defined below, NOT measured from real ink
  code_fp:      computed_at_run # sha256 over src/meander/*.py, stamped in results

# ---------------------------------------------------------------- lexicon (E)
lexicon:
  # v0.2 §2 B1: word embeddings with clean paradigmatic geometry, d=300,
  # SENSE-DISAMBIGUATED. Static embeddings sense-blend (bank/crane) and that
  # blend corrupts the F-METRIC test itself, so disambiguation is not optional.
  intended:
    model:        "glove.6B.300d"        # or fastText cc.en.300; either is legal
    dim:          300
    provenance:   prior
    status:       PRESENT                # downloaded 2026-08-27, ./data (gitignored)
    source:       "https://nlp.stanford.edu/data/glove.6B.zip"
  disambiguation:
    # MONOSEMOUS COMMON-NOUN FILTER. Exactly one WordNet synset (a static vector
    # cannot sense-blend what has one sense), AND pos == noun, AND not an
    # instance. The last two conditions are load-bearing, not fastidiousness --
    # see the `revisions` entry: filtering on synset count alone yielded a
    # lexicon ~40% proper nouns and function words, which would have measured
    # entity co-occurrence clustering and reported it as semantic metric
    # preservation.
    strategy:     monosemous_common_noun_wordnet
    provenance:   pinned_by_fiat
    yield:        "1877/18350 in the rank window [200,20000); sampled to 500"
    known_limit: >
      A few pronoun-ish nouns ('someone', 'nobody') and abbreviations ('gmt',
      'cia') survive. Stated as a v1 limit rather than filtered further.
    fallback:     "hand-curated sense-tagged subset if WordNet unavailable"
  size_target:    500           # "a few hundred" (v0.2 §9 B1)
  harness_only:
    # A structured SYNTHETIC space so the harness can be proven to run and the
    # nulls can be measured with zero network. It is NOT a result. Any number
    # produced against it is stamped `synthetic: true` and may never be quoted.
    model:        "synthetic-hierarchical-v1"
    dim:          300
    provenance:   nominal_unmeasured

# ---------------------------------------------------------------- noise model
noise:
  # v0.2 §11 marks these TODO_measure and SAFETY-class until set. They are STILL
  # not measured - measuring them needs a real pen and a real scanner. They are
  # therefore pinned as NOMINAL and every law that consumes them is listed in
  # `disabled_laws`. The harness sweeps sigma rather than trusting one value.
  ink_sigma:        0.06        # centreline jitter, in units of stroke width
  ink_width_sigma:  0.10        # stroke-width jitter, fraction of nominal width
  scan_sigma:       0.03        # additive Gaussian on [0,1] pixel intensity
  scan_blur_px:     0.8         # sensor MTF proxy, Gaussian sigma in pixels
  provenance:       nominal_unmeasured
  sweep:            [0.25, 0.5, 1.0, 2.0, 4.0]   # multipliers applied to all four

# ---------------------------------------------------------------- render
render:
  raster_px:        128         # read resolution
  stroke_width_px:  2.5
  contour_points:   256         # polyline samples per closed contour
  margin:           0.12
  provenance:       pinned_by_fiat

# ---------------------------------------------------------------- perceptual
perceptual:
  # THE HONEST WEAK POINT OF B0. v0.2 §4.1 wants "perceptual contour distance";
  # v0.1 §4.1 named LPIPS or human triplets. Both need either a network download
  # or human subjects. What is pinned here is an explicit PROXY: low-pass the
  # raster at a foveal scale, then L2. It stands in for a human eye and it is
  # labelled as a stand-in everywhere it is used.
  metric:           "lowpass_l2_v1"
  foveal_blur_px:   1.6         # low-pass before comparison (acuity proxy)
  provenance:       nominal_unmeasured
  upgrade_path:     "LPIPS (needs weights download) or human 2AFC triplets"
  jnd:
    # Just-noticeable-difference: the perceptual distance below which two
    # rendered glyphs count as COLLIDED. Calibrated by the harness as the
    # distance produced by pure render noise at nominal sigma (i.e. two
    # noisy renders of the SAME meaning), at the 95th percentile.
    calibration:    "p95 of same-meaning noisy-render distance"
    provenance:     measured

# ---------------------------------------------------------------- bit budget
budget:
  # v0.2 §6. The paper numbers are PRIORS. B0's job is to replace the physical
  # one with a measured one via the actual render -> noise -> re-extract loop.
  glyph_capacity_bits:        15        # provenance: prior (Miller 14-20; ink-SNR 12-18)
  bits_per_node_lexicon:      13        # log2(10k); provenance: prior (arithmetic)
  bits_per_proposition_3leg:  75        # provenance: prior
  bits_per_magnitude_role:    3         # provenance: prior
  starvation_factor:          5         # provenance: prior (derived)
  efd_bits_by_harmonic:       [4, 3, 2, 1, 1, 0.5]   # h1..h6; provenance: prior
  measured:
    # provenance: MEASURED 2026-08-27, code_fp stamped in results/*.json.
    # NOT synthetic-contaminated: the capacity probe samples shape parameters
    # directly and never touches the lexicon, so these numbers stand whatever E
    # turns out to be. They are the one part of B0 that is a real result.
    method: >
      0.5*log2(var(z)/var(z - E[z|z_hat])), z_hat re-extracted from the noisy
      render, conditional expectation fitted on the whole received vector so
      cross-parameter leakage is removed.
    raster_px: 128
    at_nominal_sigma:
      m2:  {free_params: 5,  bits: 3.87, by_harmonic: [3.83, 0.04]}
      m4:  {free_params: 13, bits: 4.36, by_harmonic: [2.15, 0.03, 2.09, 0.10]}
      m6:  {free_params: 21, bits: 5.87, by_harmonic: [2.38, 0.07, 1.79, 0.04, 1.48, 0.12]}
      m8:  {free_params: 29, bits: 6.49, by_harmonic: [2.43, 0.05, 1.84, 0.02, 1.33, 0.02, 0.78, 0.03]}
    findings:
      - "MEASURED CAPACITY IS ~4-6.5 BITS, NOT THE ~15 OF THE §6 PRIOR. Even at
         m=8 with 29 free parameters the glyph carries 6.5 bits. If this holds on
         a real E it makes the §6 starvation factor WORSE, not better: ~13 bits
         are needed to index a 10k lexicon."
      - "THE CHANNEL IS NOT NOISE-LIMITED AT NOMINAL SIGMA. Noise costs 0.15 bits
         out of a 6.02-bit ceiling at m=6; you must reach 4x nominal sigma before
         it costs 2.6 bits. The loss is in the CARRIER, not the ink. Raising
         capacity means changing the shape basis or the decoder, not buying a
         better pen or a higher-resolution scan."
      - "EVEN HARMONICS CARRY ALMOST NOTHING (~0.02-0.12 bits per harmonic
         against 1.3-2.4 for odd ones), consistently across m. Arc-length
         reparameterisation has period pi for a near-elliptical contour, so it
         generates odd-harmonic content and scrambles even-harmonic content.
         Roughly half the EFD parameters are dead weight as a channel."
      - "HARMONIC 1 IS A FRAME, NOT A PAYLOAD. Under the A7 canonical
         normalisation a1=1 and b1=c1=0, leaving only d1 free, so m harmonics
         carry 1+4*(m-1) parameters rather than 4m. The §6 prior credited
         harmonic 1 with ~4 bits; it measures 2.2-2.4 from its single parameter."

# ---------------------------------------------------------------- shape space
shape_space:
  # The legible region, measured. Sampling uniformly in coefficient space yields
  # SELF-INTERSECTING contours 71% of the time; no amplitude budget alone gets
  # below ~30%. Cause: with a1 pinned to 1 by the A7 frame, d1 is the minor axis,
  # so d1 -> 0 collapses the base curve to a segment and any perturbation crosses
  # it. Bounding d1 away from zero fixes it.
  d1_range:            [0.25, 0.90]     # provenance: measured
  harmonic_base:       0.20             # amplitude at h2, decaying 1/n
  selfcross_rate:                       # provenance: measured
    m2: 0.00
    m4: 0.04
    m6: 0.07
    m8: 0.16
  finding: >
    LEGIBILITY IS A THIRD PARETO AXIS THAT §6 NEVER COSTED. The drawable region
    is a small awkward subset of coefficient space, it shrinks as m grows, and
    usable capacity is therefore strictly below the free-parameter count.

# ---------------------------------------------------------------- resolution
resolution:
  # The A5 dial. m = retained harmonics. The Pareto frontier is swept over this.
  m_sweep:          [1, 2, 3, 4, 5, 6, 8, 10]
  m_operating:      null        # B1 picks ONE; all falsifiers judged at that one

# ---------------------------------------------------------------- FLOORS
floors:
  # ===== PINNED 2026-08-27, BEFORE ANY PHI EXISTED. DO NOT MOVE. =====
  f_metric_forcedchoice_min:      0.75
  # rationale: 2AFC chance = 0.50. 0.75 is the standard psychophysical threshold
  # convention for 2AFC (halfway chance->ceiling) and is the weakest bar that can
  # still be called "a reader can reliably tell which shape is the neighbour".
  # provenance: pinned_by_fiat

  f_metric_margin_over_best_null: 0.05
  # rationale: phi must beat the BEST strong null by >= 5 points absolute AND
  # with non-overlapping 95% bootstrap CIs. Clearing 0.75 while merely tying
  # PCA-2D is a FAIL: it would mean the learned map bought nothing.
  # provenance: pinned_by_fiat

  f_metric_precision_at_5_min:    0.40
  # rationale: retrieval-side check on the same frozen phi. Chance for k=5 over
  # N=500 is 0.01. 0.40 says a majority-ish of a concept's rendered neighbours
  # are its true semantic neighbours. provenance: pinned_by_fiat

  f_collision_max_rate:           0.01
  # rationale: at most 1% of lexicon pairs may fall below the measured JND at the
  # operating (m, N, sigma). Above that the script cannot carry its own lexicon.
  # provenance: pinned_by_fiat

  f_roundtrip_min_recovery:       0.90
  # rationale: top-1 identity recovery through phi -> phi^-1 at the SAME frozen
  # phi as F-METRIC (v0.2 §7: not deferred to a later rung).
  # provenance: pinned_by_fiat

  f_degrade_monotone:             required
  # rationale: r(k) non-increasing in k AND zero category flips at any k.
  # A single low-k confident-wrong decode kills A5 outright.
  # provenance: pinned_by_fiat (v0.2 §7)

  f_closure_structural_catch:     0.99    # B3
  f_closure_roleswap_catch:       0.95    # B3, requires role-parity; A8 gate
  # provenance: pinned_by_fiat

# ---------------------------------------------------------------- nulls
nulls:
  # M-NULL: the null must be STRONG. Beating random-phi proves nothing and is
  # BANNED as a null (v0.2 retired v0.1's "correlation beats random-phi").
  required:
    - roundtrip_only_phi          # same arch, loss 1 only
    - pca_2d_render               # linear 2-D squash -> shape
    - discrete_code_matched_bits  # arbitrary codebook at matched capacity
  added_by_b0:
    - discrete_semantic_ordered
    # NOT in the spec's list. It is the honest strongest adversary: quantise E,
    # then assign codebook shapes by a 1-D spectral ordering of the cluster
    # centroids, so nearby clusters get nearby shapes. This is "a syllabary that
    # cheated by sorting its glyphs semantically" - the thing a sceptic will
    # immediately propose as the cheaper way to get metric-preservation without
    # any continuity at all. If phi cannot beat it, phi is not earning its keep.
  optional:
    - umap_2d_render              # SKIPPED if umap-learn absent; never silent
  banned:
    - random_phi                  # M-NULL; a crippled null is a fake floor

# ---------------------------------------------------------------- disabled
disabled_laws:
  # Every law whose input is still nominal/unmeasured. Reported, never defaulted.
  - law: F-COLLISION
    disabled_by: "noise.provenance == nominal_unmeasured"
    effect: "collision rate is conditional on a GUESSED sigma; not a real bar yet"
  - law: F-METRIC (human-legible mode)
    disabled_by: "perceptual.provenance == nominal_unmeasured"
    effect: >
      the lowpass-L2 proxy is not a human eye. Until LPIPS or human triplets
      land, a PASS licenses only the MACHINE-READABLE claim (v0.2 §8), never
      the human-legibility claim.
  - law: ALL (real-E rungs)
    disabled_by: "lexicon.intended.status == NOT_PRESENT_ON_DISK"
    effect: "no embeddings on disk; harness runs on synthetic E and stamps synthetic:true"

retracted:
  - "v0.1 §0 'first continuous writing system / no symbol inventory'"
  - "v0.1 A8 'never a fabricated certainty'"
  - "v0.1 A5 'resolution=precision' as free (now nested-loss-conditional)"
  - "v0.1 F-METRIC 'correlation beats random-phi'"

# ---------------------------------------------------------------- prereg
preregistrations:
  - id: B1-EXT-1
    declared: 2026-08-28
    status: DECLARED_BEFORE_ANY_M_GT_10_RESULT_EXISTED
    receipt: >
      This block is committed in its own commit, containing no results, BEFORE
      the run. The git history is the evidence that the bars below were fixed in
      advance; if they had been chosen afterwards the ordering would show it.
    motivation: >
      The pre-registered B1 sweep FAILED (NO_OPERATING_POINT). The loss-weight
      frontier then found `continuity_all_four` at m=10 clearing 5 of 6 floors,
      missing only the margin bar and missing it by 0.012 - while phi's advantage
      over the best null WIDENS with resolution (0.015 at m=3 -> 0.038 at m=10)
      and the null itself stays flat (0.706 -> 0.715). Extending a sweep after
      seeing a near miss is p-hacking if it is reported as confirmation. So it is
      declared here as a SEPARATE test with its own id, run once, reported
      whichever way it lands.
    does_not_supersede: >
      The original B1 verdict stands as FAIL whatever this returns. This does not
      re-roll B1; it asks a new question - does the margin cross 0.05 at higher
      resolution - and answers it once.
    frozen_config:
      map: phi_continuity_all_four
      loss_weights: {roundtrip: 0.5, continuity: 3.0, separation: 0.5, nested: 0.5}
      epochs: 3000
      lexicon: "glove.6B.300d, monosemous_common_noun_wordnet, N=500"
    m_values: [12, 14, 16, 20]
    bars_unchanged:   # restated verbatim from `floors:` so they cannot drift
      f_metric_forcedchoice_min:        0.75
      f_metric_margin_over_best_null:   0.05
      ci_disjoint_from_best_null:       required
      f_metric_precision_at_5_min:      0.40
      f_roundtrip_min_recovery:         0.90
      f_collision_max_rate:             0.01
    new_bar_pinned_now:
      simple_contour_rate_min: 0.95
      why: >
        The specific way this extension could win dishonestly is by buying margin
        with glyphs a hand cannot draw. Self-intersection already reaches 16% at
        m=8 under uniform sampling and the legible region shrinks as m rises, so
        a "pass" at m=20 could be purchased with undrawable contours - trading
        the falsifier for the very thing the falsifier exists to protect. Pinned
        before any m>10 result exists. 0.95 is just below the 0.984 the current
        best config achieves, so it demands no regression and permits no collapse.
    rider_declared_before_result:
      id: B1-EXT-1-HOLDOUT
      condition: >
        A RESCUE from B1-EXT-1 DOES NOT license a pass claim on its own. Every
        result in this project so far is IN-SAMPLE: phi is trained on all 500
        words and F-METRIC is then measured on those same 500. v0.1 §7 asked for
        held-out concepts and this implementation never did it. phi has far more
        capacity to fit than PCA or UMAP, so the comparison is biased in phi's
        favour - which is why it does not weaken a FAIL (phi loses despite the
        advantage) but would make a PASS unsafe.
      requirement: >
        If B1-EXT-1 returns RESCUE, re-run the winning configuration with phi and
        every null fitted on a 400-word train split and F-METRIC measured on the
        100 held-out words, at the same unchanged bars. Only the held-out number
        may be quoted as a pass.
      declared: 2026-08-28
      declared_before_seeing: B1-EXT-1 results

    outcome:
      verdict: NO_RESCUE
      ran: 2026-08-28
      artifact: results/b1_ext1_frontier.json
      result_by_m:   # 2AFC / best-null / margin / precision@5 / simple-contour
        m12: [0.743, 0.728, +0.015, 0.382, 0.922]
        m14: [0.767, 0.719, +0.048, 0.409, 0.938]
        m16: [0.758, 0.725, +0.033, 0.403, 0.812]
        m20: [0.750, 0.728, +0.022, 0.414, 0.984]
      reading: >
        The hypothesis that motivated this extension - that the margin was
        climbing with resolution and would cross 0.05 - is NOT SUPPORTED. Across
        every resolution tested (m = 3, 10, 12, 14, 16, 20) the margin oscillates
        in 0.015-0.048 and never reaches the bar. It does not trend; it plateaus.
        Best point m=14: clears the absolute floor (0.767) and precision (0.409),
        misses margin by 0.002 and legibility by 0.012.
      legibility_bar_was_binding: >
        The bar pinned before this run did the job it was pinned for. Simple
        contour rates at m=12/14/16 are 0.922/0.938/0.812, all under 0.95. The
        resolutions where phi scores best are the ones where the glyphs are least
        drawable - exactly the "buy margin with undrawable glyphs" failure the
        bar exists to catch. Without it, m=14 would have been reported as a
        one-bar miss instead of a two-bar miss.
      caveat_capacity_estimator: >
        The capacity numbers at high m (15.89 at m=16, 15.00 at m=20) are
        probably INFLATED and should not be quoted. `_bits_from_regression` fits
        1+4(m-1) parameters - 61 at m=16, 77 at m=20 - against ~400 samples, so
        residual variance is under-estimated. The non-monotonicity (m=16 > m=20)
        is estimator noise, not physics. Re-measure with n_samples >> p before
        using these.
      measurement_precision: >
        RUN-TO-RUN NONDETERMINISM IS ~±0.004 2AFC, and it matters here. The
        reproduction (B1-EXT-1-REPRO, same seeds, same config, 6 threads instead
        of 4) returned 2AFC deltas of +0.0002 / -0.0035 / 0.0000 / +0.0035 at
        m=12/14/16/20 - almost certainly float reduction order varying with
        thread count. Consequence: "m=14 misses the margin by 0.002" is
        OVER-PRECISE. Its margin reads 0.0475 and 0.0440 across two runs, so the
        distance to the 0.05 bar is smaller than the instrument's noise. The
        legibility figure is worse in this respect - a proportion over only 64
        contours, SE ~0.030, so 0.938 is also within noise of its 0.95 bar.
        HONEST STATEMENT: m=14 sits AT both bars, inside measurement precision.
        Neither run cleared either, and the pinned protocol was one run per m, so
        the FAIL stands - but no claim should be made to three decimals.
        Resolving m=14 properly needs a NEW pre-registered test: n repeated runs,
        report the distribution, decide against the unchanged bars. Also raise
        the simple-contour sample from 64 to the full lexicon; it is cheap.
      reproduction_confirms_the_edit_was_harmless: >
        The original ran pre-edit maps.py while its fingerprint named the
        post-edit code. The reproduction ran the post-edit code and returned
        numbers differing only at the nondeterminism scale, which empirically
        confirms the edit was in-sample-neutral rather than leaving it as an
        assertion.
      artifact_fingerprint_untrustworthy: >
        This run's code_fp was stamped at WRITE time by the pre-patch runner,
        after src/meander/maps.py had been edited mid-run - the precise failure
        that prompted the fingerprint-at-start fix. The numbers are sound (the
        edit was in-sample-neutral) but the artifact cannot attest to its own
        provenance. Reproduced under B1-EXT-1-REPRO with correct fingerprinting;
        that is a reproduction of the same seeded config, NOT a second trial.

  - id: B1-EXT-1-HOLDOUT
    declared: 2026-08-28
    status: RAN
    outcome:
      verdict: NO_PASS
      artifact: results/b1_holdout.json
      protocol: "fit on 400, F-METRIC scored on 100 unseen, bars unchanged"
      phi_2afc: 0.706          # [0.674, 0.739]
      best_null_2afc: 0.621    # umap_2d_render
      margin: +0.085           # CLEARS the 0.05 bar that in-sample B1 failed
      precision_at_5: 0.356    # misses 0.40
      cleared: 3               # of 6
      reading: >
        The failure mode INVERTS. Held out, phi clears the margin bar it failed
        in-sample (+0.085 vs +0.038) and misses the absolute floor it had cleared
        (0.706 vs 0.753). Still a FAIL, on different bars.
      rider_prediction_was_wrong: >
        The rider argued in-sample scoring would flatter phi, a ~500k-parameter
        network, relative to rank-2 projections. Measured, the NULLS fell further:
        umap -0.094, pca -0.104, against phi's -0.047. phi generalises BETTER
        than the 2-D squashes. UMAP is transductive, so its transform() on unseen
        points is genuinely weaker than its fitted embedding, and it lost ground
        even given that fair version rather than a nearest-neighbour stand-in.

  - id: DIAG-SPLIT-M10
    declared: 2026-08-28
    status: RAN
    kind: DIAGNOSTIC_NOT_A_PASS_TEST
    outcome:
      artifact: results/diag_split_m10.json
      method: >
        Score a 500-fitted and a 400-fitted phi on the SAME 100 test words and
        the SAME triples, so task difficulty cancels and the residual gap is
        generalisation alone.
      generalisation_gap:   # seen-during-fit -> unseen-during-fit
        phi_continuity_all_four: [0.744, 0.706, +0.037]
        umap_2d_render:          [0.679, 0.621, +0.057]
        roundtrip_only_phi:      [0.656, 0.598, +0.059]
        pca_2d_render:           [0.600, 0.614, -0.014]
      reading: >
        Settles the confound the held-out run could not. The difficulty effect is
        SMALL: phi scores 0.753 on the 500-word task and 0.744 on the 100-word
        task with identical training, so only ~0.009 of the drop was "harder
        test" and 0.037 is real generalisation loss. phi generalises better than
        its strongest null (0.037 vs 0.057). And even the CONTAMINATED arm reaches
        only 0.744 on this task - phi does not clear 0.75 under any condition
        tested here.

revisions:      # append-only. [{date, key, old, new, reason, peeked}]
  - date: 2026-08-27
    key: falsifiers.DIST_RANK (F-METRIC triple construction)
    old: [50, 150]
    new: [4, 12]
    peeked: synthetic_only
    reason: >
      The first implementation drew forced-choice distractors from semantic ranks
      50-150. Every map scored 0.98-1.00, nulls included, which made the pinned
      0.75 floor unfalsifiable - a bar nothing can fail is not a bar. This was a
      DEVIATION FROM THE STAKE rather than a threshold that needed moving: v0.2
      §7 asks for "confusable NEAR-NEIGHBOUR triples", and rank 50 of 300 is not
      a near neighbour. The correction brings the code into line with the spec.
      Disclosure: it was made after seeing results, but only on the SYNTHETIC
      stand-in space; no real-E number existed, and none has been produced since.
      The old band is retained as `coarse_acc_diagnostic_only` so the vacuity is
      visible in every report rather than deleted from the record.
    no_floor_was_moved: true

  - date: 2026-08-27
    key: lexicon.disambiguation.strategy
    old: monosemous_wordnet (synset count only)
    new: monosemous_common_noun_wordnet (+ pos==n, + no instance_hypernyms)
    peeked: false
    reason: >
      Synset count alone is not sense-disambiguation for this test. The first
      500-word draw from real GloVe was roughly 40% proper nouns ('italy',
      'michael', 'malaysia', 'nigeria' - each has exactly one synset) plus
      function words ('within', 'sometimes', 'mainly', 'non'). Neither is a
      concept: proper-noun geometry encodes entity co-occurrence and function-word
      geometry encodes syntactic distribution, so F-METRIC would have been
      measuring a structure that is not the one §2 asks about, and any pass would
      have been meaningless. Changed BEFORE any real-E falsifier number was read.
    no_floor_was_moved: true

  - date: 2026-08-27
    key: nulls.optional.umap_2d_render
    old: SKIPPED (umap-learn not installed)
    new: RUNS (umap-learn installed 2026-08-27)
    peeked: false
    reason: >
      Recorded because it CHANGED A VERDICT. At m=4 on real E, phi scores 0.729
      and umap_2d_render scores 0.718 - it is the strongest null by a wide
      margin. With umap absent the best null would have been roundtrip_only_phi
      at 0.649, and phi would have shown a ~0.08 margin instead of 0.011: a
      false positive produced purely by a missing baseline. This is M-NULL's
      whole point ("a crippled null is a fake floor") caught in the act.
    no_floor_was_moved: true

  - date: 2026-08-27
    key: falsifiers.f_degrade pass criterion
    old: "monotone radii AND worst_flip_rate == 0.0"
    new: "monotone radii AND monotone true-concept rank AND rank stays in top 5%"
    peeked: synthetic_only
    reason: >
      The old criterion was STRICTER THAN THIS LOCK, which pins only
      `f_degrade_monotone: required`. Zero flips at every truncation is
      unachievable by arithmetic: at k=1 the code carries one free parameter
      against the ~8 bits needed to name one of 300 concepts, so nearly
      everything flips however good phi is. Applied literally it reported A5 as
      failing when the nested loss was in fact working - at k=1 phi sat at
      semantic radius 0.175 against the round-trip-only null's 0.897. A5's claim
      is "degrades into vagueness, never into error", which is about flip
      DISTANCE: a near-miss is vagueness and legal, a far miss is confident-wrong
      and fatal. The new criterion measures the true concept's rank under
      truncation, which is what the spec's words describe. Floors unchanged.
    no_floor_was_moved: true

  - date: 2026-08-27
    key: training epochs (default)
    old: 400
    new: 3000
    peeked: synthetic_only
    reason: >
      At 400 epochs F-ROUNDTRIP read 0.25-0.34 and looked like capacity
      starvation. It was undertraining: the same network reaches 0.983 at 1500
      epochs and 1.000 at 4000. Reporting the 400-epoch number as a structural
      result would have been a false kill. No floor changed; the compute budget
      did.
    no_floor_was_moved: true
